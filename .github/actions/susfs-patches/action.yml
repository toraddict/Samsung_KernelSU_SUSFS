name: apply susfs patches
description: apply susfs patches

inputs:
  nomount:
    description: 'nomount'
    required: true

runs:
  using: composite
  steps:
    - name: clone susfs
      shell: bash
      run: |
        SUSFS_BRANCH="gki-$ANDROID_VER-$KERNEL_VER"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@github.com"

        cd susfs4ksu
        git fetch https://gitlab.com/pershoot/susfs4ksu.git gki-android14-6.1-dev
        git log ..FETCH_HEAD --oneline -n 2 | awk '{print $1}' | tac | xargs git cherry-pick

        SUSFS4KSU="$ROOT/susfs4ksu"
        echo "SUSFS4KSU=$SUSFS4KSU" >> "$GITHUB_ENV"

    - name: Apply to KSUN
      shell: bash
      run: |
        #cd "$COMMON/KernelSU-Next"
        #SUSFS_VERSION="v2.1.0"
        #cp "$SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" .
        #patch -p1 < 10_enable_susfs_for_ksu.patch || true
        #rm -rf 10_enable_susfs_for_ksu.patch

        #cp "$KERNEL_PATCHES/next/susfs_fix_patches/$SUSFS_VERSION/"*.patch .
        #rm -rf multi_manager.patch
        #for p in *.patch; do
        #  patch -p1 < "$p"
        #  rm -f "$p"
        #done

    - name: Copy required files
      shell: bash
      run: |
        cd "$COMMON"

        cp "$SUSFS4KSU/kernel_patches/fs/"* ./fs/
        cp "$SUSFS4KSU/kernel_patches/include/linux/"* ./include/linux/
        cp "$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-$ANDROID_VER-$KERNEL_VER.patch" ./

    - name: prepare namespace and open.c for susfs patch because samsung
      shell: bash
      run: |
        cd "$COMMON"

        echo "Preparing fs/open.c for SUSFS..."
        sed -i '/#ifdef CONFIG_SECURITY_DEFEX/,/^#endif/d' fs/open.c

        echo "Preparing fs/namespace.c for SUSFS..."

        python3 - <<'PY'
        from pathlib import Path

        path = Path("fs/namespace.c")
        data = path.read_text()

        start = "copy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;"
        pos = data.find(start)

        if pos == -1:
            print("copy_flags block not found, leaving fs/namespace.c unchanged")
            raise SystemExit(0)

        block_end = data.find("#endif", pos)

        if block_end == -1:
            print("No #endif found after copy_flags block, leaving fs/namespace.c unchanged")
            raise SystemExit(0)

        block_end += len("#endif")
        block = data[pos:block_end]

        if "#ifdef CONFIG_KDP_NS" not in block:
            print("CONFIG_KDP_NS block not found, leaving fs/namespace.c unchanged")
            raise SystemExit(0)

        kdp_start = block.find("#ifdef CONFIG_KDP_NS")
        kdp_end = block.find("#endif", kdp_start)

        if kdp_end == -1:
            print("CONFIG_KDP_NS #endif not found, leaving fs/namespace.c unchanged")
            raise SystemExit(0)

        kdp_end += len("#endif")
        kdp_block = block[kdp_start:kdp_end]

        if "#else" not in kdp_block:
            print("CONFIG_KDP_NS #else not found, leaving block unchanged")
            raise SystemExit(0)

        else_pos = kdp_block.find("#else")
        endif_pos = kdp_block.rfind("#endif")

        replacement = kdp_block[else_pos + len("#else"):endif_pos]

        new_block = block[:kdp_start] + replacement + block[kdp_end:]
        data = data[:pos] + new_block + data[block_end:]

        path.write_text(data)
        print("fs/namespace.c prepared successfully")
        PY

    - name: apply susfs patch and fix if necessary
      shell: bash
      run: |
        cd "$COMMON"

        SUSFS_CORE_PATCH="50_add_susfs_in_gki-$ANDROID_VER-$KERNEL_VER.patch"

        if [ ! -f "$SUSFS_CORE_PATCH" ]; then
          echo "ERROR: SUSFS core patch not found: $SUSFS_CORE_PATCH"
          exit 1
        fi

        echo "Applying SUSFS core patch: $SUSFS_CORE_PATCH"

        if ! patch -p1 < "$SUSFS_CORE_PATCH"; then
          echo "ERROR: SUSFS core patch failed"
          exit 1
        fi

        rm -f "$SUSFS_CORE_PATCH"

        shopt -s nullglob
        patches=("$KERNEL_PATCHES/samsung/$BRANCH"/*.patch)

        if [ ${#patches[@]} -gt 0 ]; then
          echo "Patches found, applying..."
          cp "${patches[@]}" ./

          # Fix SUSFS rejects
          for p in *.patch; do
            echo "Applying SUSFS/Samsung patch: $p"

            if ! patch -p1 < "$p"; then
              echo "ERROR: Failed to apply patch: $p"
              exit 1
            fi

            rm -f "$p"
          done

          # Fix missing VMA_PAD_START
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1i #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
            echo "Added VMA_PAD_START fallback to fs/proc/task_mmu.c"
          fi

          # Fix missing page_size_compat.h
          if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
            echo "Added page_size_compat.h to fs/proc/task_mmu.c"
          fi

          # Fix missing SUSFS header in fs/proc/base.c
          if grep -q 'SUSFS_IS_INODE_OPEN_REDIRECT' fs/proc/base.c || grep -q 'SUSFS_IS_INODE_SUS_MAP' fs/proc/base.c; then
            if [ -f include/linux/susfs.h ] && ! grep -q '#include <linux/susfs.h>' fs/proc/base.c; then
              sed -i '1i #include <linux/susfs.h>' fs/proc/base.c
              echo "Added linux/susfs.h to fs/proc/base.c"
            fi
          fi

          # Verify SUSFS inode helper definitions
          if grep -q 'SUSFS_IS_INODE_OPEN_REDIRECT' fs/proc/base.c && ! grep -Rqs 'SUSFS_IS_INODE_OPEN_REDIRECT' include/linux fs; then
            echo "ERROR: SUSFS_IS_INODE_OPEN_REDIRECT is used but not defined"
            exit 1
          fi

          if grep -q 'SUSFS_IS_INODE_SUS_MAP' fs/proc/base.c && ! grep -Rqs 'SUSFS_IS_INODE_SUS_MAP' include/linux fs; then
            echo "ERROR: SUSFS_IS_INODE_SUS_MAP is used but not defined"
            exit 1
          fi

          shopt -u nullglob
        else
          echo "No Samsung SUSFS patch files found, skipping"
          shopt -u nullglob
        fi

    - name: add ksu-susfs to config
      shell: bash
      run: |
        "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU_SUSFS
